version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: growth_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growth_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-memory_layer}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: growth_agent_n8n
    restart: unless-stopped
    environment:
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-memory_layer}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-growth_agent}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-password123}
      # Environment Configuration
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  pg-data:
  n8n_data:
